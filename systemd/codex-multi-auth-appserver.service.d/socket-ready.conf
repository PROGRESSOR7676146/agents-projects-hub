[Service]
# The multi-auth wrapper's detached-helper reaper is appropriate for short CLI
# launches, but a resident systemd app-server owns its proxy for the unit's full
# lifetime. systemd's cgroup and KillMode clean the helper up with the unit.
Environment=CODEX_MULTI_AUTH_APP_ROTATION_DETACHED_IDLE_MS=0
Environment=CODEX_MULTI_AUTH_APP_ROTATION_MAX_LIFETIME_MS=0
Environment=CODEX_MULTI_AUTH_APP_ROTATION_IDLE_MS=315360000000
# A Unix socket inode can survive an abrupt host/WSL stop. Existence is not
# readiness; ordered consumers may start only after a real connection succeeds.
ExecStartPost=%h/.local/share/agents-projects-hub/venv/bin/agents-projects-hub-wait-socket %h/.codex/app-server-control/app-server-control.sock --timeout 30
