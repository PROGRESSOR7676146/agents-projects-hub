[Service]
# The trusted parent must see host root ownership when checking the immutable
# Claude/hook runtime. User-manager mount namespaces can hide UID 0. The model
# itself still runs inside the validated bubblewrap filesystem/PID boundary.
PrivateTmp=false
PrivateUsers=false
# Run after generic Codex socket drop-ins and clear their mount requests too.
BindPaths=
