[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-projects-hub"
version = "0.3.0"
description = "Privacy-first orchestration hub for persistent agent sessions in Telegram project topics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/PROGRESSOR7676146/agents-projects-hub"
Repository = "https://github.com/PROGRESSOR7676146/agents-projects-hub"
Issues = "https://github.com/PROGRESSOR7676146/agents-projects-hub/issues"

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
hcr = "hermes_codex_router.cli:main"
agents-projects-hub = "hermes_codex_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false
