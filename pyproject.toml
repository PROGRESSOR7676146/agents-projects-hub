[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-projects-hub"
version = "0.3.0"
description = "Privacy-first orchestration hub for persistent agent sessions in Telegram project topics"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.scripts]
hcr = "hermes_codex_router.cli:main"
agents-projects-hub = "hermes_codex_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
