version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # ADR 0087: eligible dependency-only updates may merge without independent
    # model review; all other gates remain. Wait a week first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # ADR 0087: eligible dependency-only updates may merge without independent
    # model review; all other gates remain. Wait a week first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
