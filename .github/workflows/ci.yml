name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/validate.yml

  # Informational trend report; the required gate is the validation matrix.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --extra dev
      - name: Measure test coverage
        run: |
          .venv/bin/python -m coverage run -m unittest discover -s tests -q
          .venv/bin/python -m coverage report > coverage.txt
          {
            echo '## Test coverage (branch)'
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
            echo '<details><summary>Per module</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
