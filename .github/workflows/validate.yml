name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra dev
      - name: Canonical repository validation
        run: .venv/bin/python scripts/validate.py
      # Canonical runs isolate each test module; this also catches state that
      # leaks between modules sharing one process (ADR 0041).
      - name: Shared-process test discovery
        timeout-minutes: 20
        # A hang ends after 15 minutes with every thread's traceback in the log.
        run: timeout --signal=ABRT --kill-after=60 900 .venv/bin/python -X faulthandler -m unittest discover -s tests -q

  namespace:
    runs-on: ubuntu-24.04
    env:
      HUB_REQUIRE_NAMESPACE_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install system namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor
          /usr/bin/bwrap --help | grep -F -- '--bind-fd'
          /usr/bin/bwrap --help | grep -F -- '--ro-bind-fd'
      # CI runner only: permit user namespaces for the system bwrap executable.
      # Keep Ubuntu's restriction for every other unprivileged program.
      - name: Permit bubblewrap user namespaces on this runner
        run: |
          sudo install -m 0644 /dev/stdin /etc/apparmor.d/hub-ci-bwrap <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile hub-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --replace /etc/apparmor.d/hub-ci-bwrap
      - name: Install locked dependencies
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --extra dev
      - name: Real namespace isolation and permission roundtrip
        timeout-minutes: 5
        run: >-
          .venv/bin/python -m unittest -v
          tests.test_claude_file_sandbox
          tests.test_claude_private_mount_aliases
          tests.test_claude_permission_host_roundtrip.PermissionHostRoundtripTests.test_namespace_client_preserves_peer_gate_and_atomic_allow_deny
          tests.test_claude_custody_rehearsal.ClaudeCustodyRehearsalTests.test_namespace_blocks_authority_aliases_and_privilege_but_shares_network
          tests.test_codex_native_namespace
          tests.test_process_namespace_rehearsal
          tests.test_process_namespace
          tests.test_process_namespace_topology
          tests.test_namespace_worktrees
          tests.test_review_materials_namespace
          tests.test_review_bridge_namespace
          tests.test_namespace_toolchain

  tlive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fetch and verify pinned source archive before unpacking
        run: |
          npm pack tlive@5.3.1 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tlive-5.3.1.tgz"
          manifest = json.loads(pathlib.Path("integrations/tlive/source-manifest.json").read_text())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest["archive_sha256"]
          with tarfile.open(archive) as source:
              source.extractall(path=pathlib.Path(os.environ["RUNNER_TEMP"]) / "tlive", filter="data")
          PY
      - name: Apply pinned patch and prepare build dependencies
        run: |
          python scripts/tlive_extension.py check-base "$RUNNER_TEMP/tlive/package" --archive "$RUNNER_TEMP/tlive-5.3.1.tgz"
          python scripts/tlive_extension.py apply "$RUNNER_TEMP/tlive/package"
          # npm 10.9.9 bundled with Node 22 fails clean Arborist resolution (edgesOut).
          # Pin the tested resolver without changing the runner's global npm.
          npm exec --yes --package=npm@12.0.2 -- npm install --prefix "$RUNNER_TEMP/tlive/package" --ignore-scripts --include=dev
      - name: Build and run carried offline regressions
        run: python scripts/tlive_extension.py build "$RUNNER_TEMP/tlive/package"
