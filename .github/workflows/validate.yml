name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra dev
      - name: Prepare optional public author policy
        env:
          HUB_PUBLIC_GIT_AUTHOR_EMAIL: ${{ vars.HUB_PUBLIC_GIT_AUTHOR_EMAIL }}
        run: python scripts/prepare_public_author_policy.py
      - name: Canonical repository validation
        run: .venv/bin/python scripts/validate.py
      # Canonical runs isolate each test module; this also catches state that
      # leaks between modules sharing one process (ADR 0041).
      - name: Shared-process test discovery
        timeout-minutes: 20
        # A hang ends after 15 minutes with every thread's traceback in the log.
        run: timeout --signal=ABRT --kill-after=60 900 .venv/bin/python -X faulthandler -m unittest discover -s tests -q
