name: Bug report
description: Report a reproducible non-security defect
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials here; use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Use fake IDs, tokens, paths, and disposable repositories only.
    validations:
      required: true
